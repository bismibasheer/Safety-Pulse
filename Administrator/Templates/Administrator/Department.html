<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <form action="" method="post">
        {%csrf_token%}
        <table border="1" align="center">
            <tr>
                <th>Department Name</th>
                <td><input type="text" name="txt_dept" id="department" value="{{editdepts.department_name}}"></td>
            </tr>
            <tr>
                <td colspan="2" align="center"><input type="submit" value="submit" name="btn_submit">
                <input type="submit" value="cancel" name="btn_cancel"></td>
            </tr>
        </table>
    </form>
    <br>
    <br>
    <br>
    <table border="1" align="center">
    <tr><th>#</th><th>Department</th><th>Actions</th></tr>
    {% for i in department %}
        <tr>
            <td>{{forloop.counter}}</td>
            <td>{{i.department_name}}</td>
            <td><a href="{% url 'Admin:deletedept' i.id %}">DELETE</a></td>
            <td><a href="{% url 'Admin:editdept' i.id %}">Edit</a></td>
            
        </tr>
             {% endfor %}
        </table> 
        <br><br><br>
        <center><a href="{% url 'Admin:AdminHome' %}">AdminHome</a></center>  
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>reply complaint</title>
</head>
<body>
    <form action="" method="post">
        {%csrf_token%}
        <table border="1" align="center">
            <tr>
                <th>Subject</th>
                <td>{{complaint.com_subject}}</td>
            </tr>
            <tr>
                <th>Complaint</th>
                <td>{{complaint.com_complaint}}</td>
            </tr>
            <tr>
                <th>Date</th>
                <td>{{complaint.com_date}}</td>
            </tr>
            <tr>
                <th>Username</th>
                <td>{{user.user_name}}</td>
            </tr>
            <tr>
                
                <td colspan="2" align="center"><textarea name="txt_reply" id="reply" placeholder="Enter Reply" style="width: 300px; height: 100px;"></textarea></td>
            </tr>
            <tr>
                <td colspan="2" align="center"><input type="submit" value="submit" name="txt_submit">
                <input type="submit" value="cancel" name="txt_cancel"></td>
            </tr>
        </table>
    </form>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <form action="" method="post">
        {%csrf_token%}
        <table border="1" align="center">
            <tr>
                <td>Category</td>
                
                <td>
                    <select name="sel_category">
                        {% for i in cat %}
                            <option {% if editsub.category.id == i.id %} selected {% endif %} value="{{i.id}}">{{i.category_name}}</option>
                       
            
                            {% endfor %}
                </select>
            </td>
               
            </tr>
            <tr>
                <th>Subcategory</th>
                <td><input type="text" name="txt_sub" id="Subcategory" value="{{editsub.subcategory_name}}" ></td>
                
            </tr>
            <tr>
                <td colspan="2" align="center"><input type="submit" value="submit" name="btn_submit">
                <input type="submit" value="cancel" name="btn_cancel"></td>
            </tr>
        </table>
    </form>
    <br>
    <br>
    <br>
    <table border="1" align="center">
    <tr><th>#</th><th>category</th><th>Subcategory</th><th>Actions</th></tr>
    {% for i in sub %}
        <tr>
            <td>{{forloop.counter}}</td>
            <td>{{i.category.category_name}}</td>
            <td>{{i.subcategory_name}}</td>
            <td><a href="{% url 'Admin:deletesubcategory' i.id %}">DELETE</a></td>
            <td><a href="{% url 'Admin:editsubcategory' i.id %}">Edit</a></td>
        </tr>
             {% endfor %}
        </table> 
        <br><br><br>
        <center><a href="{% url 'Admin:AdminHome' %}">BACK TO HOME</a></center>  
</body>
</html>

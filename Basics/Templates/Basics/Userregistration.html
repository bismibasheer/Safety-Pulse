<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>User Registration</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css">
    <style>
        body {
            font-family: Verdana, Geneva, sans-serif;
            font-size: 14px;
            background: white;
            background-image: url('https://images.pexels.com/photos/7195315/pexels-photo-7195315.jpeg?auto=compress&cs=tinysrgb&w=1260&h=750&dpr=1');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            margin: 0;
            padding: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .form_wrapper {
            background: #fff;
            width: 600px;
            max-width: 100%;
            box-sizing: border-box;
            padding: 25px;
            margin: 8% auto 0;
            position: relative;
            border-top: 5px solid green;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
            border-radius: 10px;
            transition: all 0.5s ease;
        }

        .input_field {
            position: relative;
            margin-bottom: 20px;
        }

        .input_field > span {
            position: absolute;
            left: 0;
            top: 0;
            color: #333;
            height: 100%;
            border-right: 1px solid #cccccc;
            text-align: center;
            width: 30px;
        }

        .input_field > span > i {
            padding-top: 10px;
        }

        input[type="text"],
        input[type="email"],
        input[type="password"],
        textarea,
        select {
            width: 100%;
            padding: 8px 10px 9px 35px;
            height: 35px;
            border: 1px solid #cccccc;
            box-sizing: border-box;
            outline: none;
            transition: all 0.30s ease-in-out;
        }

        textarea {
            height: 100px;
            padding: 8px 10px 9px 35px;
        }

        .button {
            background: green;
            height: 35px;
            width: 48%;
            border: none;
            color: #fff;
            font-size: 1.1em;
            cursor: pointer;
            transition: all 0.30s ease-in-out;
        }

        .button:hover {
            background: gray;
        }

        .button-container {
            display: flex;
            justify-content: space-between;
        }

        .input_field.file_input {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .input_field.file_input span {
            background: green;
            color: white;
            padding: 8px 12px;
            border-radius: 5px;
            cursor: pointer;
            transition: background 0.3s ease;
        }

        .input_field.file_input span:hover {
            background: gray;
        }

        .input_field.file_input input[type="file"] {
            display: none;
        }

        .input_field.file_input label {
            color: #333;
            font-size: 14px;
            cursor: pointer;
        }

        /* Processing overlay */
        #processing-overlay {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 1000;
            opacity: 0;
            visibility: hidden;
            transition: all 0.3s ease;
            background: rgba(255, 255, 255, 0.8); /* Added semi-transparent background to make it visible */
        }

        #processing-overlay.active {
            opacity: 1;
            visibility: visible;
        }

        #processing-overlay .spinner {
            width: 80px;
            height: 80px;
            border: 8px dotted #D3D3D3;
            border-top: 8px dotted #D3D3D3;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            position: relative;
            display: inline-block;
            vertical-align: middle;
        }

        #processing-overlay .spinner::after {
            content: '';
            position: absolute;
            top: -8px;
            left: -8px;
            right: -8px;
            bottom: -8px;
            border: 8px dotted rgba(211, 211, 211, 0.5);
            border-top: 8px dotted transparent;
            border-radius: 50%;
            animation: spin 1.5s linear infinite reverse;
        }

        #processing-overlay h3 {
            color: green;
            font-size: 24px;
            margin-left: 10px;
            display: inline-block;
            vertical-align: middle;
            animation: fadeIn 0.5s ease;
        }

        /* Confirmation overlay */
        #confirmation-overlay {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 1000;
            opacity: 0;
            visibility: hidden;
            transition: all 0.3s ease;
        }

        #confirmation-overlay.active {
            opacity: 1;
            visibility: visible;
        }

        #confirmation-overlay .message {
            color: #4682B4;
            font-size: 24px;
            text-align: center;
            padding: 15px 30px;
            background: rgba(144, 238, 144, 0.3);
            border-radius: 10px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>
    <div class="form_wrapper">
        <div class="form_container">
            <div class="title_container">
                <h2>User Registration</h2>
            </div>
            <div class="row clearfix">
                <div class="form">
                    <form enctype="multipart/form-data" method="post" id="registrationForm">
                        {% csrf_token %}
                        <div class="input_field">
                            <span><i aria-hidden="true" class="fa fa-user"></i></span>
                            <input required type="text" title="Name Allows Only Alphabets,Spaces and First Letter Must Be Capital Letter" 
                                   pattern="^[A-Z]+[a-zA-Z ]*$" name="txt_name" id="txt_name" placeholder="Name">
                        </div>

                        <div class="input_field">
                            <span><i aria-hidden="true" class="fa fa-envelope"></i></span>
                            <input required type="email" name="txt_email" id="email" placeholder="Email">
                        </div>

                        <div class="input_field">
                            <span><i aria-hidden="true" class="fa fa-phone"></i></span>
                            <input type="text" required name="txt_contact" id="txt_contact" 
                                   pattern="[7-9]{1}[0-9]{9}" title="Phone number with 7-9 and remaining 9 digits with 0-9" 
                                   placeholder="Contact">
                        </div>

                        <div class="input_field">
                            <span><i aria-hidden="true" class="fa fa-map-marker"></i></span>
                            <textarea name="txt_address" id="txt_address" required placeholder="Address"></textarea>
                        </div>

                        <div class="input_field select_option">
                            <span><i aria-hidden="true" class="fa fa-globe"></i></span>
                            <select name="seldistrict" id="seldistrict" required>
                                <option value="">Select District</option>
                                {% for i in district %}
                                <option value="{{i.id}}">{{i.district_name}}</option>
                                {% endfor %}
                            </select>
                        </div>

                        <div class="input_field select_option">
                            <span><i aria-hidden="true" class="fa fa-map-pin"></i></span>
                            <select name="selplace" id="selplace" required>
                                <option value="">Select Place</option>
                            </select>
                        </div>

                        <div class="input_field">
                            <span><i aria-hidden="true" class="fa fa-camera"></i></span>
                            <input type="file" name="photo" id="photo" required style="padding: 8px 10px 9px 35px; height: 35px; border: 1px solid #cccccc; box-sizing: border-box; outline: none; width: 100%;">
                        </div>

                        <div class="input_field">
                            <span><i aria-hidden="true" class="fa fa-lock"></i></span>
                            <input type="password" name="txt_password" id="txt_password" 
                                   pattern="(?=.*\d)(?=.*[a-z])(?=.*[A-Z]).{8,}" 
                                   title="Must contain at least one number and one uppercase and lowercase letter, and at least 8 or more characters" 
                                   placeholder="Password">
                        </div>

                        <div class="input_field">
                            <span><i aria-hidden="true" class="fa fa-lock"></i></span>
                            <input type="password" required name="txt_repassword" id="txt_repassword" 
                                   placeholder="Retype Password">
                        </div>

                        <div class="button-container">
                            <input type="submit" name="btnsubmit" value="Submit" class="button">
                            <input type="reset" name="btncancel" value="Cancel" class="button">
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
    <div id="processing-overlay">
        <div class="spinner"></div>
        <h3>Processing...</h3>
    </div>

    <div id="confirmation-overlay">
        <div class="message">"Waiting for our confirmation. Please check your mail."</div>
    </div>

    {% if msg %}
    <script>
        alert("{{msg}}");
    </script>
    {% endif %}

    {% if msg1 %}
    <script>
        alert("{{msg1}}");
    </script>
    {% endif %}

    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.6.0/jquery.min.js"></script>
    <script>
        // Function to get CSRF token
        function getCookie(name) {
            let cookieValue = null;
            if (document.cookie && document.cookie !== '') {
                const cookies = document.cookie.split(';');
                for (let i = 0; i < cookies.length; i++) {
                    const cookie = cookies[i].trim();
                    if (cookie.substring(0, name.length + 1) === (name + '=')) {
                        cookieValue = decodeURIComponent(cookie.substring(name.length + 1));
                        break;
                    }
                }
            }
            return cookieValue;
        }
        const csrftoken = getCookie('csrftoken');

        $(document).ready(function() {
            // District change handler
            $("#seldistrict").change(function() {
                var did = $(this).val();
                $.ajax({
                    url: "{% url 'Guest:ajaxplace' %}",
                    data: { did: did },
                    success: function(data) {
                        $("#selplace").html(data);
                    },
                    error: function() {
                        alert("Failed to load places. Please try again.");
                    }
                });
            });

            // Form submission handler
            $("#registrationForm").submit(function(e) {
                e.preventDefault();
                
                // Client-side validation
                if ($("#txt_password").val() !== $("#txt_repassword").val()) {
                    alert("Password mismatch!");
                    return false;
                }

                // First check email availability
                var email = $("#email").val();
                $.ajax({
                    url: "{% url 'Guest:check_email' %}",
                    type: "POST",
                    data: {
                        'email': email,
                        'csrfmiddlewaretoken': csrftoken
                    },
                    dataType: 'json',
                    success: function(response) {
                        if (response.exists) {
                            alert("Email Already Exists");
                            return false;
                        } else {
                            // If email is available, proceed with form submission
                            submitForm();
                        }
                    },
                    error: function(xhr, status, error) {
                        alert("Error checking email: " + error);
                    }
                });
            });

            function submitForm() {
                console.log("Submitting form..."); // Debug log
                alert("Starting form submission process"); // Debug alert
                // Show processing overlay
                $("#processing-overlay").addClass("active");
                console.log("Processing overlay activated"); // Debug log
                
                // Submit form via AJAX
                var formData = new FormData($("#registrationForm")[0]);
                $.ajax({
                    url: "{% url 'Basics:userreg' %}",
                    type: 'POST',
                    data: formData,
                    processData: false,
                    contentType: false,
                    headers: { "X-CSRFToken": csrftoken },
                    success: function(response) {
                        console.log("AJAX Success:", response); // Debug log
                        alert("AJAX Success: " + (typeof response === 'object' ? JSON.stringify(response) : response.substring(0, 100))); // Debug alert
                        // Check if response contains success flag
                        if ($(response).find('#success-flag').length > 0) {
                            setTimeout(function() {
                                $("#processing-overlay").removeClass("active");
                                $("#confirmation-overlay").addClass("active");
                                setTimeout(function() {
                                    window.location.href = "{% url 'Guest:login' %}";
                                }, 2000);
                            }, 2000);
                        } else {
                            $("#processing-overlay").removeClass("active");
                            // Reload the page with error messages
                            $('body').html(response);
                        }
                    },
                    error: function(xhr, status, error) {
                        console.log("AJAX Error:", error); // Debug log
                        alert("AJAX Error: Status: " + status + ", Error: " + error); // Debug alert
                        $("#processing-overlay").removeClass("active");
                    }
                });
            }
        });
    </script>
</body>
</html>
